<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>교회 비품 관리 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
        .item-card { transition: all 0.2s ease-in-out; }
        .item-card:hover { transform: translateY(-4px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .tab-active { color: #2563eb; border-bottom: 2px solid #2563eb; }
        .overdue-row { background-color: #fef2f2 !important; }
        .overdue-text { color: #dc2626 !important; font-weight: 700; }
        .img-compare { width: 100%; height: 240px; object-fit: contain; border-radius: 12px; background-color: #f1f5f9; }
        .item-master-img { width: 100%; height: 160px; object-fit: contain; border-radius: 16px; background-color: #f1f5f9; }
        .display-img-full { width: 100%; height: auto; max-height: 300px; object-fit: contain; border-radius: 16px; background-color: #f1f5f9; }
        #login-screen { background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%); }
    </style>
</head>
<body class="pb-20">

    <div id="login-screen" class="fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl p-8">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-blue-600 text-white rounded-2xl flex items-center justify-center text-3xl mx-auto mb-4">
                    <i class="fas fa-church"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-800">비품대여센터 로그인</h1>
                <p class="text-sm text-gray-500 mt-1">부서별 아이디와 비밀번호를 입력하세요.</p>
            </div>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">아이디 (숫자 4자리)</label>
                    <input type="text" id="login-id" class="w-full p-4 border rounded-2xl focus:ring-2 focus:ring-blue-400 outline-none" placeholder="0000" required>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">비밀번호</label>
                    <input type="password" id="login-pw" class="w-full p-4 border rounded-2xl focus:ring-2 focus:ring-blue-400 outline-none" placeholder="••••••••" required>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl hover:bg-blue-700 transition shadow-lg shadow-blue-100">로그인</button>
            </form>
        </div>
    </div>

    <div id="app-content" class="hidden">
        <header class="bg-white border-b sticky top-0 z-30">
            <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
                <h1 class="text-xl font-bold text-blue-600 cursor-pointer" onclick="switchView('catalog')">
                    <i class="fas fa-church mr-2"></i>비품대여센터
                </h1>
                <nav class="flex space-x-6 text-sm font-semibold">
                    <button id="nav-catalog" onclick="switchView('catalog')" class="py-5 tab-active">대여하기</button>
                    <button id="nav-return" onclick="switchView('return')" class="py-5 text-gray-500">반납신청</button>
                    <button id="nav-admin" onclick="switchView('admin')" class="py-5 text-gray-500 hidden">관리자모드</button>
                    <button onclick="handleLogout()" class="py-5 text-red-400 hover:text-red-600"><i class="fas fa-sign-out-alt"></i></button>
                </nav>
            </div>
        </header>

        <main class="max-w-5xl mx-auto px-4 py-8">
            <div id="user-info-bar" class="mb-6 flex items-center justify-between bg-blue-50 px-6 py-3 rounded-2xl border border-blue-100">
                <span class="text-sm font-bold text-blue-800"><i class="fas fa-user-circle mr-2"></i><span id="display-user-dept"></span></span>
                <span class="text-xs text-blue-600 font-medium tracking-tight">로그인 중</span>
            </div>
            
            <section id="view-catalog" class="block">
                <div class="mb-8 text-center md:text-left">
                    <h2 class="text-2xl font-bold text-gray-800">비품 목록</h2>
                    <p class="text-gray-500">비품의 위치와 사진을 확인하고 예약하세요.</p>
                </div>
                <div id="item-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            </section>

            <section id="view-return" class="hidden">
                <div class="mb-8">
                    <h2 class="text-2xl font-bold text-gray-800">반납 신청</h2>
                    <p class="text-gray-500">현재 대여 중인 물품입니다. 반납 시 상태를 확인해 주세요.</p>
                </div>
                <div id="return-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </section>

            <section id="view-admin" class="hidden">
                <div class="flex items-center justify-between mb-8">
                    <h2 class="text-2xl font-bold text-gray-800">기획부 통합 관리</h2>
                    <div class="flex bg-gray-100 p-1 rounded-xl">
                        <button onclick="switchAdminSubView('rentals')" id="btn-sub-rentals" class="px-4 py-2 rounded-lg text-sm font-bold bg-white shadow-sm transition-all">대여 현황</button>
                        <button onclick="switchAdminSubView('master')" id="btn-sub-master" class="px-4 py-2 rounded-lg text-sm font-bold text-gray-500 transition-all">비품 마스터 관리</button>
                    </div>
                </div>

                <div id="admin-sub-rentals" class="block">
                    <div class="bg-white rounded-2xl shadow-sm border overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left">
                                <thead class="bg-gray-50 text-gray-600 text-sm font-semibold uppercase">
                                    <tr>
                                        <th class="px-6 py-4">비품 정보</th>
                                        <th class="px-6 py-4">대여 부서/담당자</th>
                                        <th class="px-6 py-4">대여일시</th>
                                        <th class="px-6 py-4">반납예정</th>
                                        <th class="px-6 py-4">상태</th>
                                        <th class="px-6 py-4">작업</th>
                                    </tr>
                                </thead>
                                <tbody id="rental-log-body" class="divide-y text-gray-700"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div id="admin-sub-master" class="hidden">
                    <div class="flex justify-end mb-4">
                        <button onclick="openItemModal('add')" class="bg-blue-600 text-white px-4 py-2 rounded-xl font-bold text-sm hover:bg-blue-700 transition">
                            <i class="fas fa-plus mr-2"></i>새 비품 추가
                        </button>
                    </div>
                    <div id="admin-master-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                </div>
            </section>
        </main>
    </div>

    <div id="rental-modal" class="fixed inset-0 bg-black/50 hidden z-40 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-md overflow-hidden shadow-2xl">
            <div class="p-6 max-h-[90vh] overflow-y-auto">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-xl font-bold" id="modal-title">비품 대여 신청</h3>
                    <button onclick="closeModal('rental-modal')" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times text-xl"></i></button>
                </div>
                <div id="modal-item-info" class="mb-6 bg-gray-50 rounded-2xl p-4 border border-gray-100">
                    <img id="modal-display-img" src="" class="display-img-full mb-3 shadow-sm border border-gray-200">
                    <div class="flex items-center text-sm font-bold text-gray-700 bg-white p-3 rounded-xl border border-gray-100">
                        <i class="fas fa-map-marker-alt text-red-500 mr-2"></i>
                        위치: <span id="modal-display-location" class="ml-1 text-blue-600"></span>
                    </div>
                </div>
                <form id="rental-form" class="space-y-4">
                    <input type="hidden" id="form-item-id">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1 uppercase">소속 부서</label>
                        <input type="text" id="form-dept-readonly" class="w-full p-3 bg-gray-100 border rounded-xl outline-none font-bold text-gray-700" readonly>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-500 mb-1">담당자 성함</label>
                            <input type="text" id="form-user" placeholder="성함" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-400 outline-none" required>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 mb-1">연락처</label>
                            <input type="tel" id="form-phone" placeholder="010-0000-0000" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-400 outline-none" required>
                        </div>
                    </div>
                    <div class="bg-blue-50/50 p-4 rounded-2xl border border-blue-100">
                        <div class="flex items-center justify-between mb-2">
                            <label class="block text-sm font-bold text-gray-700">대여 수량</label>
                            <span id="form-available-info" class="text-xs font-semibold text-blue-600"></span>
                        </div>
                        <input type="number" id="form-quantity" min="1" value="1" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-400 outline-none font-bold" required>
                    </div>
                    <div class="p-4 bg-gray-50 rounded-2xl border border-dashed">
                        <label class="block text-xs font-bold text-gray-500 mb-3 uppercase">반납 예정 일시</label>
                        <div class="grid grid-cols-2 gap-4">
                            <input type="date" id="form-return-date" class="w-full p-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-400" required>
                            <select id="form-return-hour" class="w-full p-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-400" required></select>
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl hover:bg-blue-700 transition">대여 신청하기</button>
                </form>
            </div>
        </div>
    </div>

    <div id="admin-master-modal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-md overflow-hidden shadow-2xl p-6">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold" id="master-modal-title">비품 정보 관리</h3>
                <button onclick="closeModal('admin-master-modal')" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times text-xl"></i></button>
            </div>
            <form id="master-edit-form" class="space-y-4">
                <input type="hidden" id="edit-item-id">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">비품 명칭</label>
                    <input type="text" id="edit-name" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-400 outline-none" placeholder="예: 부스테이블" required>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">총 보유 수량</label>
                    <input type="number" id="edit-total" min="1" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-400 outline-none" required>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">비품 위치</label>
                    <input type="text" id="edit-location" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-400 outline-none" placeholder="예: 창고" required>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">이미지 URL</label>
                    <input type="text" id="edit-img-url" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-400 outline-none" placeholder="https://..." required>
                </div>
                <button type="submit" class="w-full bg-gray-800 text-white font-bold py-4 rounded-xl hover:bg-black transition">저장하기</button>
            </form>
        </div>
    </div>

    <div id="return-modal" class="fixed inset-0 bg-black/50 hidden z-40 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-md overflow-hidden shadow-2xl p-6">
            <h3 class="text-xl font-bold mb-4" id="return-modal-title">반납 신청</h3>
            <form id="return-form" class="space-y-4">
                <input type="hidden" id="return-rental-id">
                <div class="grid grid-cols-2 gap-2">
                    <label class="border p-3 rounded-xl text-center cursor-pointer has-[:checked]:bg-blue-50 has-[:checked]:border-blue-500"><input type="radio" name="return-condition" value="Good" checked class="hidden">정상</label>
                    <label class="border p-3 rounded-xl text-center cursor-pointer has-[:checked]:bg-red-50 has-[:checked]:border-red-500"><input type="radio" name="return-condition" value="Damaged" class="hidden text-red-500">파손/분실</label>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl">반납 제출</button>
            </form>
        </div>
    </div>

    <div id="confirm-modal" class="fixed inset-0 bg-black/60 hidden z-[100] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-sm p-6 text-center">
            <p id="confirm-msg" class="mb-6 font-medium text-gray-800"></p>
            <div class="flex space-x-3">
                <button id="confirm-cancel" class="flex-1 py-3 bg-gray-100 rounded-xl font-bold text-gray-600">취소</button>
                <button id="confirm-ok" class="flex-1 py-3 bg-blue-600 text-white rounded-xl font-bold">확인</button>
            </div>
        </div>
    </div>
    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full shadow-lg hidden z-[110] transition-all">
        <span id="toast-msg"></span>
    </div>

    <script>
        // 1. Supabase 설정 연동
        const SUPABASE_URL = 'https://cjvpwdhvchfujtundlbg.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_8L8JN3b7yQ44eXPlpNoakg_z9yqyt2I';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const userDb = {
            "0003": { pw: "0003!", dept: "내무부" }, "0031": { pw: "0031!", dept: "장로회" }, "0032": { pw: "0032!", dept: "자문회" }, "0033": { pw: "0033!", dept: "장년회" }, "0034": { pw: "0034!", dept: "부녀회" }, "0035": { pw: "0035!", dept: "청년회" }, "0036": { pw: "0036!", dept: "학생회" }, "0037": { pw: "0037!", dept: "유년회" }, "0005": { pw: "0005!", dept: "재정부" }, "0006": { pw: "0006!", dept: "교육부" }, "0007": { pw: "0007!", dept: "신학부" }, "0008": { pw: "0008!", dept: "해외선교부" }, "0009": { pw: "0009!", dept: "전도부" }, "0010": { pw: "0010!", dept: "문화부" }, "0011": { pw: "0011!", dept: "출판부" }, "0012": { pw: "0012!", dept: "정보통신부" }, "0013": { pw: "0013!", dept: "찬양부" }, "0014": { pw: "0014!", dept: "섭외부" }, "0015": { pw: "0015!", dept: "국내선교부" }, "0016": { pw: "0016!", dept: "홍보부" }, "0017": { pw: "0017!", dept: "법무부" }, "0019": { pw: "0019!", dept: "건설부" }, "0020": { pw: "0020!", dept: "체육부" }, "0021": { pw: "0021!", dept: "사업부" }, "0022": { pw: "0022!", dept: "보건후생복지부" }, "0023": { pw: "0023!", dept: "봉사교통부" },
            "0004": { pw: "0004!", dept: "기획부", isAdmin: true }
        };

        let currentUser = null;
        let items = [];
        let rentals = [];

        // 시간 선택 생성
        const hourSelect = document.getElementById('form-return-hour');
        for (let i = 0; i < 24; i++) {
            const opt = document.createElement('option');
            opt.value = i;
            opt.innerText = i < 10 ? `0${i}:00` : `${i}:00`;
            hourSelect.appendChild(opt);
        }

        // 데이터 가져오기
        async function fetchData() {
            const { data: itemsData } = await supabaseClient.from('items').select('*').order('id');
            const { data: rentalsData } = await supabaseClient.from('rentals').select('*').order('id', { ascending: false });
            items = itemsData || [];
            rentals = rentalsData || [];
            renderItems();
            renderReturnList();
            if (currentUser?.isAdmin) { renderLogs(); renderMasterGrid(); }
        }

        // 로그인
        document.getElementById('login-form').onsubmit = async function(e) {
            e.preventDefault();
            const id = document.getElementById('login-id').value;
            const pw = document.getElementById('login-pw').value;
            if (userDb[id] && userDb[id].pw === pw) {
                currentUser = { id, ...userDb[id] };
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('app-content').classList.remove('hidden');
                document.getElementById('display-user-dept').innerText = currentUser.dept;
                document.getElementById('nav-admin').classList.toggle('hidden', !currentUser.isAdmin);
                await fetchData();
                showToast(`${currentUser.dept}님 로그인 성공`);
                switchView('catalog');
            } else showToast("아이디와 비밀번호를 확인하세요.");
        };

        function handleLogout() {
            customConfirm("로그아웃 하시겠습니까?", () => {
                currentUser = null;
                document.getElementById('login-screen').classList.remove('hidden');
                document.getElementById('app-content').classList.add('hidden');
            });
        }

        async function switchView(view) {
            const views = ['catalog', 'return', 'admin'];
            views.forEach(v => {
                document.getElementById(`view-${v}`)?.classList.toggle('hidden', v !== view);
                document.getElementById(`nav-${v}`)?.classList.toggle('tab-active', v === view);
            });
            await fetchData();
        }

        function renderItems() {
            const grid = document.getElementById('item-grid');
            grid.innerHTML = items.map(item => `
                <div class="item-card bg-white rounded-3xl border shadow-sm overflow-hidden flex flex-col">
                    <img src="${item.img_url}" class="w-full h-44 object-contain bg-gray-50 border-b">
                    <div class="p-5 flex flex-col flex-1">
                        <h3 class="text-lg font-bold text-gray-800 mb-1">${item.name}</h3>
                        <div class="text-xs text-gray-500 mb-4 flex items-center">
                            <i class="fas fa-map-marker-alt mr-1 text-red-400"></i> ${item.location}
                        </div>
                        <div class="mt-auto">
                            <div class="flex justify-between items-center mb-4">
                                <span class="text-sm font-bold ${item.available > 0 ? 'text-green-600' : 'text-red-500'}">재고: ${item.available} / ${item.total}</span>
                            </div>
                            <button onclick="openRentalModal(${item.id})" ${item.available === 0 ? 'disabled' : ''}
                                class="w-full py-3 rounded-xl font-bold transition ${item.available > 0 ? 'bg-blue-600 text-white hover:bg-blue-700' : 'bg-gray-200 text-gray-400'}">
                                ${item.available > 0 ? '대여하기' : '재고없음'}
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function openRentalModal(itemId) {
            const item = items.find(i => i.id === itemId);
            document.getElementById('modal-title').innerText = item.name;
            document.getElementById('form-item-id').value = itemId;
            document.getElementById('form-dept-readonly').value = currentUser.dept;
            document.getElementById('modal-display-img').src = item.img_url;
            document.getElementById('modal-display-location').innerText = item.location;
            const qtyInput = document.getElementById('form-quantity');
            qtyInput.value = 1;
            qtyInput.max = item.available;
            document.getElementById('form-available-info').innerText = `남은 수량: ${item.available}개`;
            document.getElementById('rental-modal').classList.remove('hidden');
        }

        // 대여 신청
        document.getElementById('rental-form').onsubmit = async function(e) {
            e.preventDefault();
            const itemId = parseInt(document.getElementById('form-item-id').value);
            const item = items.find(i => i.id === itemId);
            const qty = parseInt(document.getElementById('form-quantity').value);
            const deadlineDateStr = document.getElementById('form-return-date').value + 'T' + document.getElementById('form-return-hour').value.padStart(2, '0') + ':00';
            
            const rentalData = {
                item_id: itemId,
                item_name: item.name,
                dept: currentUser.dept,
                user_name: document.getElementById('form-user').value,
                phone: document.getElementById('form-phone').value,
                qty: qty,
                deadline: deadlineDateStr,
                status: '대여중'
            };

            const { error: rentError } = await supabaseClient.from('rentals').insert([rentalData]);
            if (rentError) return showToast("대여 실패");

            await supabaseClient.from('items').update({ available: item.available - qty }).eq('id', itemId);
            
            showToast("대여 완료!");
            closeModal('rental-modal');
            await fetchData();
        };

        function renderReturnList() {
            const list = document.getElementById('return-list');
            const myRentals = rentals.filter(r => r.status === '대여중' && (currentUser.isAdmin || r.dept === currentUser.dept));
            list.innerHTML = myRentals.length ? myRentals.map(r => `
                <div class="bg-white p-5 rounded-2xl border flex items-center justify-between shadow-sm">
                    <div>
                        <div class="text-[10px] font-bold text-blue-600 mb-1">${r.dept} (${r.qty}개)</div>
                        <div class="font-bold text-lg text-gray-800">${r.item_name}</div>
                    </div>
                    <button onclick="openReturnModal(${r.id})" class="px-5 py-2 bg-gray-800 text-white text-sm font-bold rounded-xl hover:bg-black transition">반납 신청</button>
                </div>
            `).join('') : `<div class="col-span-full py-16 text-center text-gray-400 border-2 border-dashed rounded-3xl">대기 물품 없음</div>`;
        }

        function openReturnModal(rentalId) {
            document.getElementById('return-rental-id').value = rentalId;
            document.getElementById('return-modal').classList.remove('hidden');
        }

        document.getElementById('return-form').onsubmit = async function(e) {
            e.preventDefault();
            const rentalId = parseInt(document.getElementById('return-rental-id').value);
            const condition = document.querySelector('input[name="return-condition"]:checked').value;
            
            await supabaseClient.from('rentals').update({ status: '반납대기', return_condition: condition }).eq('id', rentalId);
            showToast("반납 신청 완료 (관리자 승인 대기)");
            closeModal('return-modal');
            await fetchData();
        };

        // 관리자 기능
        function renderLogs() {
            const body = document.getElementById('rental-log-body');
            body.innerHTML = rentals.map(log => `
                <tr>
                    <td class="px-6 py-4 font-bold">${log.item_name} (${log.qty})</td>
                    <td class="px-6 py-4 text-sm">${log.dept} / ${log.user_name}</td>
                    <td class="px-6 py-4 text-xs">${log.start_date}</td>
                    <td class="px-6 py-4 text-xs font-semibold">${log.deadline.replace('T', ' ')}</td>
                    <td class="px-6 py-4 text-[10px] font-bold">
                        <span class="${log.status === '대여중' ? 'text-orange-500' : 'text-blue-500'}">${log.status}</span>
                    </td>
                    <td class="px-6 py-4">${log.status === '반납대기' ? `<button onclick="approveReturn(${log.id}, ${log.item_id}, ${log.qty})" class="text-blue-600 font-bold underline">승인</button>` : '-'}</td>
                </tr>
            `).join('');
        }

        async function approveReturn(rentalId, itemId, qty) {
            const item = items.find(i => i.id === itemId);
            await supabaseClient.from('rentals').update({ status: '반납완료' }).eq('id', rentalId);
            await supabaseClient.from('items').update({ available: item.available + qty }).eq('id', itemId);
            showToast("반납 승인 완료");
            await fetchData();
        }

        function renderMasterGrid() {
            const grid = document.getElementById('admin-master-grid');
            grid.innerHTML = items.map(item => `
                <div class="bg-white p-4 rounded-2xl border flex items-center space-x-4">
                    <img src="${item.img_url}" class="w-20 h-20 rounded-xl object-contain bg-gray-50 border">
                    <div class="flex-1">
                        <div class="font-bold">${item.name} (${item.total}개)</div>
                        <div class="text-xs text-blue-600 mb-2">${item.location}</div>
                        <div class="flex space-x-2">
                            <button onclick="openItemModal('edit', ${item.id})" class="text-xs text-blue-500 underline">수정</button>
                            <button onclick="deleteItem(${item.id})" class="text-xs text-red-400 underline">삭제</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function openItemModal(mode, itemId = null) {
            document.getElementById('master-edit-form').reset();
            if (mode === 'add') {
                document.getElementById('master-modal-title').innerText = "새 비품 추가";
                document.getElementById('edit-item-id').value = "";
            } else {
                const item = items.find(i => i.id === itemId);
                document.getElementById('master-modal-title').innerText = "수정";
                document.getElementById('edit-item-id').value = item.id;
                document.getElementById('edit-name').value = item.name;
                document.getElementById('edit-total').value = item.total;
                document.getElementById('edit-location').value = item.location;
                document.getElementById('edit-img-url').value = item.img_url;
            }
            document.getElementById('admin-master-modal').classList.remove('hidden');
        }

        document.getElementById('master-edit-form').onsubmit = async function(e) {
            e.preventDefault();
            const id = document.getElementById('edit-item-id').value;
            const data = {
                name: document.getElementById('edit-name').value,
                total: parseInt(document.getElementById('edit-total').value),
                available: parseInt(document.getElementById('edit-total').value),
                location: document.getElementById('edit-location').value,
                img_url: document.getElementById('edit-img-url').value
            };

            if (id) await supabaseClient.from('items').update(data).eq('id', id);
            else await supabaseClient.from('items').insert([data]);

            showToast("저장 완료");
            closeModal('admin-master-modal');
            await fetchData();
        };

        async function deleteItem(id) {
            if (confirm("삭제하시겠습니까?")) {
                await supabaseClient.from('items').delete().eq('id', id);
                await fetchData();
            }
        }

        function switchAdminSubView(view) {
            document.getElementById('admin-sub-rentals').classList.toggle('hidden', view !== 'rentals');
            document.getElementById('admin-sub-master').classList.toggle('hidden', view !== 'master');
        }

        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        function showToast(m) { const t = document.getElementById('toast'); document.getElementById('toast-msg').innerText = m; t.classList.remove('hidden'); setTimeout(() => t.classList.add('hidden'), 3000); }
        function customConfirm(m, f) { document.getElementById('confirm-msg').innerText = m; document.getElementById('confirm-modal').classList.remove('hidden'); document.getElementById('confirm-ok').onclick = () => { document.getElementById('confirm-modal').classList.add('hidden'); f(); }; document.getElementById('confirm-cancel').onclick = () => document.getElementById('confirm-modal').classList.add('hidden'); }
    </script>
</body>
</html>
