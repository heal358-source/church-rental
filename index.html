<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>교회 비품 관리 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
        .item-card { transition: all 0.2s ease-in-out; }
        .item-card:hover { transform: translateY(-4px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .tab-active { color: #2563eb; border-bottom: 2px solid #2563eb; }
        .overdue-row { background-color: #fef2f2 !important; } /* 연체 시 배경색 */
        .overdue-text { color: #dc2626 !important; font-weight: 700; } /* 연체 시 텍스트 */
        .img-compare { width: 100%; height: 240px; object-fit: contain; border-radius: 12px; background-color: #f1f5f9; }
        .display-img-full { width: 100%; height: auto; max-height: 300px; object-fit: contain; border-radius: 16px; background-color: #f1f5f9; }
        #login-screen { background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%); }
    </style>
</head>
<body class="pb-20">

    <div id="login-screen" class="fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl p-8">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-blue-600 text-white rounded-2xl flex items-center justify-center text-3xl mx-auto mb-4">
                    <i class="fas fa-church"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-800">비품대여센터 로그인</h1>
                <p class="text-sm text-gray-500 mt-1">부서 아이디와 비밀번호를 입력하세요.</p>
            </div>
            <form id="login-form" class="space-y-4">
                <input type="text" id="login-id" class="w-full p-4 border rounded-2xl outline-none focus:ring-2 focus:ring-blue-400" placeholder="아이디 (0000)" required>
                <input type="password" id="login-pw" class="w-full p-4 border rounded-2xl outline-none focus:ring-2 focus:ring-blue-400" placeholder="비밀번호" required>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl hover:bg-blue-700 transition shadow-lg">로그인</button>
            </form>
        </div>
    </div>

    <div id="app-content" class="hidden">
        <header class="bg-white border-b sticky top-0 z-30">
            <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
                <h1 class="text-xl font-bold text-blue-600 cursor-pointer" onclick="switchView('catalog')">
                    <i class="fas fa-church mr-2"></i>비품대여센터
                </h1>
                <nav class="flex space-x-6 text-sm font-semibold">
                    <button id="nav-catalog" onclick="switchView('catalog')" class="py-5 tab-active">대여하기</button>
                    <button id="nav-return" onclick="switchView('return')" class="py-5 text-gray-500">반납신청</button>
                    <button id="nav-admin" onclick="switchView('admin')" class="py-5 text-gray-500 hidden">관리자모드</button>
                    <button onclick="handleLogout()" class="py-5 text-red-400"><i class="fas fa-sign-out-alt"></i></button>
                </nav>
            </div>
        </header>

        <main class="max-w-5xl mx-auto px-4 py-8">
            <div id="user-info-bar" class="mb-6 flex items-center justify-between bg-blue-50 px-6 py-3 rounded-2xl border border-blue-100 text-blue-800">
                <span class="text-sm font-bold"><i class="fas fa-user-circle mr-2"></i><span id="display-user-dept"></span></span>
                <span class="text-xs font-medium">관리 시스템 가동 중</span>
            </div>
            
            <section id="view-catalog" class="block"><div id="item-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div></section>
            <section id="view-return" class="hidden"><div id="return-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div></section>
            
            <section id="view-admin" class="hidden">
                <div class="flex bg-gray-100 p-1 rounded-xl mb-6">
                    <button onclick="switchAdminSubView('rentals')" id="btn-sub-rentals" class="flex-1 py-2 rounded-lg text-sm font-bold bg-white shadow-sm transition-all">대여 현황</button>
                    <button onclick="switchAdminSubView('master')" id="btn-sub-master" class="flex-1 py-2 rounded-lg text-sm font-bold text-gray-500 transition-all">비품 마스터 관리</button>
                </div>
                <div id="admin-sub-rentals" class="block bg-white rounded-2xl border overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-gray-50 text-gray-600 font-bold uppercase">
                                <tr>
                                    <th class="px-6 py-4">비품 정보</th>
                                    <th class="px-6 py-4">대여 부서/담당자</th>
                                    <th class="px-6 py-4">반납예정일</th>
                                    <th class="px-6 py-4">상태</th>
                                    <th class="px-6 py-4">작업</th>
                                </tr>
                            </thead>
                            <tbody id="rental-log-body" class="divide-y text-gray-700"></tbody>
                        </table>
                    </div>
                </div>
                <div id="admin-sub-master" class="hidden">
                    <button onclick="openItemModal('add')" class="w-full mb-4 bg-blue-600 text-white py-4 rounded-xl font-bold">+ 새 비품 추가</button>
                    <div id="admin-master-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                </div>
            </section>
        </main>
    </div>

    <div id="rental-modal" class="fixed inset-0 bg-black/50 hidden z-40 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-md p-6 shadow-2xl max-h-[90vh] overflow-y-auto relative">
            <button onclick="closeModal('rental-modal')" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600"><i class="fas fa-times text-xl"></i></button>
            <h3 class="text-xl font-bold mb-4" id="modal-title">비품 대여 신청</h3>
            <img id="modal-display-img" class="display-img-full mb-4 border shadow-sm">
            <form id="rental-form" class="space-y-4">
                <input type="hidden" id="form-item-id">
                <input type="text" id="form-dept-readonly" class="w-full p-3 bg-gray-50 border rounded-xl font-bold" readonly>
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="form-user" placeholder="성함" class="w-full p-3 border rounded-xl" required>
                    <input type="tel" id="form-phone" placeholder="연락처" class="w-full p-3 border rounded-xl" required>
                </div>
                <div class="bg-blue-50 p-4 rounded-2xl border border-blue-100">
                    <div class="flex justify-between mb-2">
                        <label class="text-sm font-bold">대여 수량</label>
                        <span id="form-available-info" class="text-xs text-blue-600 font-bold"></span>
                    </div>
                    <input type="number" id="form-quantity" min="1" value="1" class="w-full p-3 border rounded-xl font-bold" required>
                </div>
                <div class="p-4 bg-gray-50 rounded-2xl border border-dashed">
                    <label class="block text-xs font-bold text-gray-500 mb-2 uppercase">반납 예정 일시</label>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="date" id="form-return-date" class="w-full p-2 border rounded-lg text-sm" required>
                        <select id="form-return-hour" class="w-full p-2 border rounded-lg text-sm" required></select>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">상태 확인용 사진 업로드 <span class="text-red-500">*</span></label>
                    <input type="file" id="form-rental-photo" accept="image/*" class="w-full text-xs" required>
                </div>
                <button type="submit" class="w-full py-4 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 transition">대여 신청 완료</button>
            </form>
        </div>
    </div>

    <div id="return-modal" class="fixed inset-0 bg-black/50 hidden z-40 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-md p-6 shadow-2xl relative">
            <button onclick="closeModal('return-modal')" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600"><i class="fas fa-times text-xl"></i></button>
            <h3 class="text-xl font-bold mb-4">반납 신청</h3>
            <form id="return-form" class="space-y-4">
                <input type="hidden" id="return-rental-id">
                <div class="flex space-x-2">
                    <label class="flex-1 border p-4 rounded-xl text-center cursor-pointer has-[:checked]:bg-blue-50 has-[:checked]:border-blue-500"><input type="radio" name="return-condition" value="Good" checked class="hidden">정상</label>
                    <label class="flex-1 border p-4 rounded-xl text-center cursor-pointer has-[:checked]:bg-red-50 has-[:checked]:border-red-500"><input type="radio" name="return-condition" value="Damaged" class="hidden">파손/분실</label>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-2">오늘 날짜로 반납 사진 촬영 <span class="text-red-500">*</span></label>
                    <input type="file" id="return-img-file" accept="image/*" class="w-full text-xs" required>
                </div>
                <button type="submit" class="w-full py-4 bg-gray-800 text-white rounded-xl font-bold hover:bg-black transition">반납 신청 제출</button>
            </form>
        </div>
    </div>

    <div id="admin-master-modal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-md p-6 shadow-2xl relative">
            <button onclick="closeModal('admin-master-modal')" class="absolute top-4 right-4 text-gray-400"><i class="fas fa-times text-xl"></i></button>
            <h3 class="text-xl font-bold mb-6" id="master-modal-title">비품 정보 관리</h3>
            <form id="master-edit-form" class="space-y-4">
                <input type="hidden" id="edit-item-id">
                <input type="text" id="edit-name" class="w-full p-3 border rounded-xl" placeholder="비품 명칭" required>
                <input type="number" id="edit-total" class="w-full p-3 border rounded-xl" placeholder="총 보유 수량" required>
                <input type="text" id="edit-location" class="w-full p-3 border rounded-xl" placeholder="보관 위치" required>
                <div>
                    <label class="block text-sm font-semibold mb-1">비품 사진</label>
                    <input type="file" id="edit-img-file" accept="image/*" class="w-full text-xs">
                </div>
                <button type="submit" class="w-full bg-gray-800 text-white font-bold py-4 rounded-xl">저장하기</button>
            </form>
        </div>
    </div>

    <div id="admin-inspect-modal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-2xl p-8 shadow-2xl relative overflow-y-auto max-h-[90vh]">
            <button onclick="closeModal('admin-inspect-modal')" class="absolute top-4 right-6 text-2xl">×</button>
            <h3 class="text-2xl font-bold mb-6">반납 검수 및 승인</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8 text-center">
                <div><p class="text-xs font-bold text-gray-400 mb-2 uppercase">대여 시 사진</p><img id="inspect-rental-img" class="img-compare border"></div>
                <div><p class="text-xs font-bold text-blue-600 mb-2 uppercase">반납 시 사진 (자동 기록일 기준)</p><img id="inspect-return-img" class="img-compare border"></div>
            </div>
            <button id="btn-final-approve" class="w-full py-4 bg-blue-600 text-white font-bold rounded-2xl hover:bg-blue-700 transition shadow-lg shadow-blue-100">최종 반납 승인</button>
        </div>
    </div>

    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-gray-800 text-white px-8 py-4 rounded-full shadow-2xl hidden z-[110] transition-all flex items-center space-x-2">
        <i class="fas fa-info-circle"></i><span id="toast-msg"></span>
    </div>

    <script>
        // --- 1. CONFIG & DB ---
        const SUPABASE_URL = 'https://cjvpwdhvchfujtundlbg.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_8L8JN3b7yQ44eXPlpNoakg_z9yqyt2I';
        const BUCKET_NAME = 'item-photos';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const userDb = {
            "0003": { pw: "0003!", dept: "내무부" }, "0031": { pw: "0031!", dept: "장로회" }, "0032": { pw: "0032!", dept: "자문회" }, "0033": { pw: "0033!", dept: "장년회" }, "0034": { pw: "0034!", dept: "부녀회" }, "0035": { pw: "0035!", dept: "청년회" }, "0036": { pw: "0036!", dept: "학생회" }, "0037": { pw: "0037!", dept: "유년회" }, "0005": { pw: "0005!", dept: "재정부" }, "0006": { pw: "0006!", dept: "교육부" }, "0007": { pw: "0007!", dept: "신학부" }, "0008": { pw: "0008!", dept: "해외선교부" }, "0009": { pw: "0009!", dept: "전도부" }, "0010": { pw: "0010!", dept: "문화부" }, "0011": { pw: "0011!", dept: "출판부" }, "0012": { pw: "0012!", dept: "정보통신부" }, "0013": { pw: "0013!", dept: "찬양부" }, "0014": { pw: "0014!", dept: "섭외부" }, "0015": { pw: "0015!", dept: "국내선교부" }, "0016": { pw: "0016!", dept: "홍보부" }, "0017": { pw: "0017!", dept: "법무부" }, "0019": { pw: "0019!", dept: "건설부" }, "0020": { pw: "0020!", dept: "체육부" }, "0021": { pw: "0021!", dept: "사업부" }, "0022": { pw: "0022!", dept: "보건후생복지부" }, "0023": { pw: "0023!", dept: "봉사교통부" },
            "0004": { pw: "0004!", dept: "기획부", isAdmin: true }
        };

        let currentUser = null;
        let items = [];
        let rentals = [];

        // --- 2. CORE UTILS ---
        async function uploadFile(file) {
            if (!file) return null;
            const fileExt = file.name.split('.').pop();
            const fileName = `${Date.now()}_${Math.floor(Math.random() * 1000)}.${fileExt}`;
            const { data, error } = await supabaseClient.storage.from(BUCKET_NAME).upload(fileName, file);
            if (error) throw error;
            return supabaseClient.storage.from(BUCKET_NAME).getPublicUrl(fileName).data.publicUrl;
        }

        async function refreshData() {
            const { data: iData } = await supabaseClient.from('items').select('*').order('id');
            const { data: rData } = await supabaseClient.from('rentals').select('*').order('id', { ascending: false });
            items = iData || []; rentals = rData || [];
            renderAll();
        }

        // --- 3. RENDERING (연체 로직 포함) ---
        function renderAll() {
            // 목록 렌더링
            const grid = document.getElementById('item-grid');
            grid.innerHTML = items.map(item => `
                <div class="item-card bg-white rounded-3xl border shadow-sm overflow-hidden flex flex-col">
                    <img src="${item.img_url || 'https://via.placeholder.com/400x300?text=No+Image'}" class="w-full h-44 object-contain bg-gray-50 border-b">
                    <div class="p-5 flex flex-col flex-1">
                        <h3 class="text-lg font-bold text-gray-800 mb-1">${item.name}</h3>
                        <p class="text-xs text-gray-500 mb-4"><i class="fas fa-map-marker-alt mr-1 text-red-400"></i> ${item.location}</p>
                        <div class="mt-auto">
                            <p class="text-sm font-bold ${item.available > 0 ? 'text-blue-600' : 'text-red-500'} mb-4">재고: ${item.available} / ${item.total}</p>
                            <button onclick="openRentalModal(${item.id})" ${item.available === 0 ? 'disabled' : ''} class="w-full py-3 rounded-xl font-bold transition ${item.available > 0 ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-400'}">${item.available > 0 ? '대여하기' : '품절'}</button>
                        </div>
                    </div>
                </div>
            `).join('');

            // 반납 신청 리스트
            const returnList = document.getElementById('return-list');
            const myR = rentals.filter(r => r.status === '대여중' && (currentUser.isAdmin || r.dept === currentUser.dept));
            returnList.innerHTML = myR.length ? myR.map(r => `
                <div class="bg-white p-5 rounded-2xl border flex items-center justify-between shadow-sm">
                    <div><p class="text-[10px] font-bold text-blue-600 mb-1">${r.dept} (${r.qty}개)</p><p class="font-bold text-lg text-gray-800">${r.item_name}</p></div>
                    <button onclick="openReturnModal(${r.id})" class="px-5 py-2 bg-gray-800 text-white text-sm font-bold rounded-xl">반납신청</button>
                </div>
            `).join('') : '<div class="col-span-full py-16 text-center text-gray-400 border-2 border-dashed rounded-3xl">현재 대여 중인 물품이 없습니다.</div>';

            // 관리자: 대여 현황 (연체 체크 로직)
            if (currentUser?.isAdmin) {
                const now = new Date();
                document.getElementById('rental-log-body').innerHTML = rentals.map(log => {
                    const deadlineDate = new Date(log.deadline);
                    const isOverdue = (log.status === '대여중' || log.status === '반납대기') && deadlineDate < now;
                    return `
                        <tr class="${isOverdue ? 'overdue-row' : ''}">
                            <td class="px-6 py-4 font-bold">${log.item_name} (${log.qty})</td>
                            <td class="px-6 py-4 text-xs font-medium text-gray-600">${log.dept} / ${log.user_name}</td>
                            <td class="px-6 py-4 text-xs ${isOverdue ? 'overdue-text' : 'text-gray-500'} font-bold">${log.deadline.replace('T', ' ')}</td>
                            <td class="px-6 py-4 text-[10px] font-bold uppercase tracking-tight">
                                <span class="${log.status === '대여중' ? 'text-orange-500' : log.status === '반납대기' ? 'text-blue-500' : 'text-gray-400'}">${log.status}</span>
                            </td>
                            <td class="px-6 py-4">${log.status === '반납대기' ? `<button onclick="adminInspectReturn(${log.id})" class="text-blue-600 font-bold underline text-xs">승인</button>` : '-'}</td>
                        </tr>
                    `;
                }).join('');

                // 비품 마스터 관리
                document.getElementById('admin-master-grid').innerHTML = items.map(item => `
                    <div class="bg-white p-4 rounded-2xl border shadow-sm flex items-center space-x-4">
                        <img src="${item.img_url}" class="w-16 h-16 rounded-xl object-contain bg-gray-50 border">
                        <div class="flex-1">
                            <p class="font-bold text-gray-800">${item.name} (${item.total}개)</p>
                            <div class="text-xs text-blue-600 mb-2">${item.location}</div>
                            <div class="flex space-x-2"><button onclick="openItemModal('edit', ${item.id})" class="text-[11px] font-bold text-blue-500 border border-blue-100 px-2 py-1 rounded">수정</button><button onclick="deleteItem(${item.id})" class="text-[11px] font-bold text-red-400 border border-red-50 px-2 py-1 rounded">삭제</button></div>
                        </div>
                    </div>
                `).join('');
            }
        }

        // --- 4. FORM LOGIC (재고 체크 및 오늘 날짜 자동화) ---

        // 로그인
        document.getElementById('login-form').onsubmit = async function(e) {
            e.preventDefault();
            const id = document.getElementById('login-id').value;
            const pw = document.getElementById('login-pw').value;
            if (userDb[id]?.pw === pw) {
                currentUser = { id, ...userDb[id] };
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('app-content').classList.remove('hidden');
                document.getElementById('display-user-dept').innerText = currentUser.dept;
                document.getElementById('nav-admin').classList.toggle('hidden', !currentUser.isAdmin);
                await refreshData();
                showToast(`${currentUser.dept}님 로그인 성공`);
            } else showToast("정보를 다시 확인해 주세요.");
        };

        // 대여 신청 (재고 검증 로직 추가)
        document.getElementById('rental-form').onsubmit = async function(e) {
            e.preventDefault();
            const itemId = parseInt(document.getElementById('form-item-id').value);
            const item = items.find(i => i.id === itemId);
            const qty = parseInt(document.getElementById('form-quantity').value);
            const deadline = document.getElementById('form-return-date').value + 'T' + document.getElementById('form-return-hour').value.padStart(2, '0') + ':00';
            const file = document.getElementById('form-rental-photo').files[0];

            // [재고 체크]
            if (qty > item.available) {
                showToast(`재고가 부족합니다! (현재 가능: ${item.available}개)`);
                return;
            }

            try {
                showToast("데이터 처리 중...");
                const photoUrl = await uploadFile(file);
                const { error: rentError } = await supabaseClient.from('rentals').insert([{
                    item_id: itemId, item_name: item.name, dept: currentUser.dept,
                    user_name: document.getElementById('form-user').value, phone: document.getElementById('form-phone').value,
                    qty, deadline, rental_photo_url: photoUrl, status: '대여중'
                }]);
                if (rentError) throw rentError;
                await supabaseClient.from('items').update({ available: item.available - qty }).eq('id', itemId);
                showToast("대여 신청이 성공적으로 완료되었습니다!");
                closeModal('rental-modal');
                await refreshData();
            } catch (err) { showToast("신청 중 오류가 발생했습니다."); }
        };

        // 반납 신청 (오늘 날짜 자동 기록)
        document.getElementById('return-form').onsubmit = async function(e) {
            e.preventDefault();
            const rId = parseInt(document.getElementById('return-rental-id').value);
            const file = document.getElementById('return-img-file').files[0];
            const now = new Date().toLocaleString('ko-KR'); // 오늘 날짜 표기용 데이터

            try {
                showToast("반납 처리 중...");
                const photoUrl = await uploadFile(file);
                await supabaseClient.from('rentals').update({
                    status: '반납대기', 
                    return_photo_url: photoUrl,
                    return_condition: document.querySelector('input[name="return-condition"]:checked').value + ` (반납일시: ${now})`
                }).eq('id', rId);
                showToast("반납 신청이 완료되었습니다.");
                closeModal('return-modal');
                await refreshData();
            } catch (err) { showToast("반납 중 오류가 발생했습니다."); }
        };

        // --- 5. UI HELPERS ---
        function switchView(view) {
            ['catalog', 'return', 'admin'].forEach(v => {
                const el = document.getElementById(`view-${v}`);
                if(el) el.classList.toggle('hidden', v !== view);
                const nav = document.getElementById(`nav-${v}`);
                if(nav) nav.classList.toggle('tab-active', v === view);
            });
            refreshData();
        }

        function switchAdminSubView(view) {
            document.getElementById('admin-sub-rentals').classList.toggle('hidden', view !== 'rentals');
            document.getElementById('admin-sub-master').classList.toggle('hidden', view !== 'master');
            document.getElementById('btn-sub-rentals').className = view === 'rentals' ? 'flex-1 py-2 rounded-lg text-sm font-bold bg-white shadow-sm transition-all' : 'flex-1 py-2 rounded-lg text-sm font-bold text-gray-500 transition-all';
            document.getElementById('btn-sub-master').className = view === 'master' ? 'px-4 py-2 rounded-lg text-sm font-bold bg-white shadow-sm transition-all' : 'px-4 py-2 rounded-lg text-sm font-bold text-gray-500 transition-all';
        }

        function openRentalModal(id) {
            const item = items.find(i => i.id === id);
            document.getElementById('form-item-id').value = id;
            document.getElementById('modal-title').innerText = item.name;
            document.getElementById('modal-display-img').src = item.img_url;
            document.getElementById('form-dept-readonly').value = currentUser.dept;
            document.getElementById('form-available-info').innerText = `${item.available}개`;
            
            const sel = document.getElementById('form-return-hour');
            sel.innerHTML = '';
            for(let i=0; i<24; i++) sel.add(new Option(i<10?`0${i}:00`:`${i}:00`, i));
            
            document.getElementById('rental-modal').classList.remove('hidden');
        }

        function adminInspectReturn(rId) {
            const r = rentals.find(x => x.id === rId);
            document.getElementById('inspect-rental-img').src = r.rental_photo_url;
            document.getElementById('inspect-return-img').src = r.return_photo_url;
            document.getElementById('btn-final-approve').onclick = async () => {
                const item = items.find(i => i.id === r.item_id);
                await supabaseClient.from('rentals').update({ status: '반납완료' }).eq('id', rId);
                await supabaseClient.from('items').update({ available: item.available + r.qty }).eq('id', r.item_id);
                showToast("최종 승인 완료!");
                closeModal('admin-inspect-modal');
                await refreshData();
            };
            document.getElementById('admin-inspect-modal').classList.remove('hidden');
        }

        function openItemModal(mode, id) {
            document.getElementById('master-edit-form').reset();
            if (mode === 'edit') {
                const item = items.find(i => i.id === id);
                document.getElementById('edit-item-id').value = id;
                document.getElementById('edit-name').value = item.name;
                document.getElementById('edit-total').value = item.total;
                document.getElementById('edit-location').value = item.location;
            } else document.getElementById('edit-item-id').value = '';
            document.getElementById('admin-master-modal').classList.remove('hidden');
        }

        async function deleteItem(id) {
            if (confirm("정말로 삭제하시겠습니까?")) {
                await supabaseClient.from('items').delete().eq('id', id);
                await refreshData();
            }
        }

        function openReturnModal(id) { 
            document.getElementById('return-rental-id').value = id; 
            document.getElementById('return-modal').classList.remove('hidden'); 
        }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        function showToast(m) { const t = document.getElementById('toast'); document.getElementById('toast-msg').innerText = m; t.classList.remove('hidden'); setTimeout(() => t.classList.add('hidden'), 3000); }
        function handleLogout() { location.reload(); }
    </script>
</body>
</html>
